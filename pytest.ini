[pytest]
testpaths = tests
base_url = http://localhost:3000
addopts = -ra --strict-markers
markers =
    p0: Critical path - blocks release if failing (auth, core purchase flow)
    p1: High - major feature broken, workaround exists
    p2: Medium - edge cases, cosmetic, low-impact
    ui: Browser tests (Playwright)
    api: REST API contract / functional tests
    security: Security-focused checks (authz, injection, data exposure)
    regression: Re-verifies a previously logged defect
xfail_strict = true
